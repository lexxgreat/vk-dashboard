name: Автостоп объявлений

# Проверяет правила из ads-rules.json: у активных баннеров групп читается статистика
# (расход, клики); при превышении порогов баннер останавливается (status: blocked).
# Триггеры:
#  - schedule: 6 слотов в час (:07 :17 :27 :37 :47 :57). ВАЖНО: GitHub прореживает
#    крон-запуски (соседний update-stats при 2 слотах/час реально срабатывал
#    4–6 раз в сутки вместо 48) — поэтому слотов много, а не «каждые 30 минут».
#    Минуты смещены с пиков :00/:30, в которые планировщик сбрасывает большую
#    часть запусков.
#  - push по ads-rules.json: сразу после изменения правил на сайте (~1 мин).
#  - workflow_run после успешного «Обновления статистики VK»: пришли свежие
#    данные — проверяем правила.
#  - repository_dispatch (autostop-check): кнопка «Проверить сейчас» на сайте.
#  - workflow_dispatch: вручную во вкладке Actions (Run workflow).

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  push:
    paths:
      - "ads-rules.json"
  repository_dispatch:
    types: [autostop-check]
  workflow_run:
    workflows: ["Обновление статистики VK"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ads-autostop
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # после чужого прогона workflow_run проверяем только успешные обновления статистики
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Проверить правила автостопа
        run: node scripts/ads_autostop.mjs
        env:
          VK_ADS_DIRECT_TOKENS: ${{ secrets.VK_ADS_DIRECT_TOKENS }}

      - name: Записать журнал в репозиторий
        run: |
          git config user.name "vk-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ads-rules-log.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "остановок нет — журнал не меняется"
          else
            git commit -m "автостоп: сработали правила $(TZ=Europe/Moscow date '+%d.%m %H:%M')"
            git push
          fi
