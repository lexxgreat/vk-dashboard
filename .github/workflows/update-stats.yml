name: Обновление статистики VK

# Каждые 30 минут собирает свежие данные из VK Рекламы и обновляет data.json.
# Сайт на GitHub Pages перестраивается автоматически после каждого коммита.
# Также можно запустить вручную: вкладка Actions → Run workflow.
# Крон стоит на 13-й и 43-й минуте часа: :00 и :30 — пиковые минуты GitHub Actions,
# в которые планировщик GitHub сбрасывает большую часть запусков (обновления
# проходили лишь пару раз в день). Смещение с пиков даёт стабильные запуски.

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Собрать данные VK Рекламы
        run: node scripts/fetch_and_export.mjs
        env:
          VK_TOKENS: ${{ secrets.VK_TOKENS }}

      - name: Экспортировать контекст для конструктора объявлений
        run: node scripts/ads_context_export.mjs
        env:
          VK_ADS_DIRECT_TOKENS: ${{ secrets.VK_ADS_DIRECT_TOKENS }}

      - name: Записать data.json в репозиторий
        run: |
          git config user.name "vk-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json ads-context.json
          if git diff --cached --quiet; then
            echo "данные не изменились — коммит не нужен"
          else
            git commit -m "данные VK: $(TZ=Europe/Moscow date '+%d.%m %H:%M')"
            git push
          fi
